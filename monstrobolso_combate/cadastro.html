
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Maremon</title>
</head>
<body>

    <h1>Criar conta no Maremon</h1>

    <form id="form_cadastro">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            required
            maxlength="100"
        >

        <label for="usuario">Usuário:</label>
        <input
            type="text"
            id="usuario"
            required
            minlength="3"
            maxlength="30"
        >

        <label for="senha">Senha:</label>
        <input
            type="password"
            id="senha"
            required
            minlength="8"
        >

        <button type="submit">Cadastrar</button>

    </form>

    <p id="mensagem"></p>

    <script src="js/cadastro.js"></script>

</body>
</html>
