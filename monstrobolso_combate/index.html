
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONSTROBOLSO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="menu">
        <h1>MONSTROBOLSO</h1>
        <button id="btnInicio">Início</button>
    </div>

    <div id="jogo">
        <img id="cenario" src="assets/casa_inicial.png" alt="Cenário">

        <button id="porta" class="interacao"></button>
        <button id="sacada" class="interacao"></button>
        <button id="boia" class="interacao"></button>

        <div id="combate">

            <img id="fundoCombate"
                 src="assets/tela_combate.png"
                 alt="Fundo do combate">

            <div id="inimigo" class="monstro">
                <img src="assets/botorosa.png" alt="Botorosa">
            </div>

            <div id="jogadorMonstro" class="monstro">
                <img src="assets/inicial.png" alt="Seu monstro">
            </div>

            <div id="statusInimigo" class="status">
                <div class="nome-status">
                    <span>INIMIGO</span>
                    <span>Lv. 5</span>
                </div>

                <div class="barra">
                    <div id="hpInimigo" class="hp"></div>
                </div>

                <div id="textoHpInimigo">100 / 100</div>
            </div>

            <div id="statusJogador" class="status">
                <div class="nome-status">
                    <span>nome do monstro</span>
                    <span>Lv. 5</span>
                </div>

                <div class="barra">
                    <div id="hpJogador" class="hp"></div>
                </div>

                <div id="textoHpJogador">100 / 100</div>
            </div>


            <div id="menuCombate">
                <div id="linha1Ataques">
                     <button class="btnAtaques" id="btnAtaque1">ataque1</button>
                     <button class="btnAtaques" id="btnAtaque2">ataque2</button>
                </div>

                 <div id="linha2Ataques">   
                    <button class="btnAtaques" id="btnAtaque3">ataque3</button>
                    <button class="btnAtaques" id="btnAura">Defesa</button>   
                </div>

        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
